<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>رادمود رادیاتور | RadMod Radiator</title>
  <style>
    @font-face {
      font-family: 'AriaFaNum';
      src: url('./AriaWebFaNum-Light.woff2') format('woff2');
      font-weight: 300;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'AriaFaNum';
      src: url('./AriaWebFaNum-Regular.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'AriaFaNum';
      src: url('./AriaWebFaNum-Medium.woff2') format('woff2');
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'AriaFaNum';
      src: url('./AriaWebFaNum-SemiBold.woff2') format('woff2');
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'AriaFaNum';
      src: url('./AriaWebFaNum-Bold.woff2') format('woff2');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'AriaFaNum';
      src: url('./AriaWebFaNum-ExtraBold.woff2') format('woff2');
      font-weight: 800;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg: #0c0e13;
      --surface: #141821;
      --surface-2: #1c2230;
      --ink: #f8fafc;
      --muted: #94a3b8;
      --line: rgba(255, 255, 255, 0.12);
      --gold: #d4a437;
      --gold-bright: #f0c65a;
      --gold-dark: #9c7218;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'AriaFaNum', Tahoma, sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--ink);
      line-height: 1.6;
    }

    a { color: inherit; text-decoration: none; }
    button, select { font-family: 'AriaFaNum', Tahoma, sans-serif; }

    .container {
      max-width: 1320px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* هدر اصلی بدون طراحی گرافیکی سنگین */
    .site-header {
      background: #10131a;
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 60;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    }

    /* برند رادمود رادیاتور در سمت راست */
    .brand-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      border: 1.5px solid var(--gold);
      display: grid;
      place-items: center;
      color: var(--gold-bright);
      background: rgba(212, 164, 55, 0.08);
    }

    .brand-texts {
      display: flex;
      flex-direction: column;
      line-height: 1.15;
    }

    .brand-fa {
      font-size: 21px;
      font-weight: 800;
      color: var(--gold-bright);
      letter-spacing: -0.3px;
    }

    .brand-en {
      font-size: 11.5px;
      font-weight: 600;
      color: #cbd5e1;
      letter-spacing: 0.4px;
      direction: ltr;
      text-align: right;
    }

    /* بخش وسط هدر: زبان و ساعت */
    .header-center {
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
    }

    .lang-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid rgba(212, 164, 55, 0.35);
      background: rgba(255, 255, 255, 0.03);
      font-size: 12.5px;
      color: #e2e8f0;
    }

    .lang-pill select {
      background: transparent;
      color: #f8fafc;
      border: none;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      outline: none;
    }

    .lang-pill select option {
      background: #141821;
      color: #f8fafc;
    }

    .clock-box {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #cbd5e1;
      padding-right: 14px;
      border-right: 1px solid var(--line);
    }

    .clock-time {
      font-weight: 700;
      color: var(--gold-bright);
      direction: ltr;
      display: block;
      line-height: 1.2;
    }

    /* ابزارهای سمت چپ هدر */
    .header-tools {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .theme-switch {
      display: inline-flex;
      align-items: center;
      background: #1a202c;
      border: 1px solid rgba(212, 164, 55, 0.35);
      border-radius: 999px;
      padding: 3px;
      gap: 2px;
    }

    .theme-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: #94a3b8;
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 13px;
      transition: 0.2s;
    }

    .theme-btn.active {
      background: linear-gradient(135deg, var(--gold-bright), var(--gold-dark));
      color: #111318;
      font-weight: 800;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.03);
      color: #e2e8f0;
      display: grid;
      place-items: center;
      cursor: pointer;
      position: relative;
      transition: 0.2s;
    }

    .icon-btn:hover {
      border-color: var(--gold);
      color: var(--gold-bright);
    }

    .cart-badge {
      position: absolute;
      top: -5px;
      left: -5px;
      min-width: 17px;
      height: 17px;
      border-radius: 999px;
      background: var(--gold-bright);
      color: #111318;
      font-size: 10.5px;
      font-weight: 800;
      display: grid;
      place-items: center;
      padding: 0 4px;
    }

    /* نوار منوی اصلی */
    .header-nav-wrap {
      padding: 10px 0;
    }

    .nav-bar {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      flex-wrap: wrap;
    }

    .nav-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 13.5px;
      font-weight: 700;
      color: #e2e8f0;
      border: 1px solid transparent;
      transition: 0.2s;
    }

    .nav-link:hover {
      color: var(--gold-bright);
      background: rgba(255, 255, 255, 0.04);
    }

    .nav-link.active {
      background: linear-gradient(135deg, var(--gold-bright), var(--gold));
      color: #12141a;
      box-shadow: 0 4px 14px rgba(212, 164, 55, 0.25);
    }

    /* فضای خالی و آماده برای مراحل بعدی */
    .stage-preview {
      min-height: 55vh;
      display: grid;
      place-items: center;
      padding: 48px 20px;
      text-align: center;
      color: var(--muted);
    }

    .stage-card {
      max-width: 560px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 28px;
    }

    .stage-card h2 {
      color: var(--ink);
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .stage-card p {
      font-size: 14px;
      color: var(--muted);
    }

    @media (max-width: 900px) {
      .header-top {
        flex-direction: column;
        align-items: stretch;
      }
      .header-center, .header-tools {
        justify-content: space-between;
      }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <!-- ردیف بالای هدر -->
      <div class="header-top">
        <!-- برند رادمود رادیاتور در سمت راست بدون طراحی گرافیکی اضافی -->
        <a href="#home" class="brand-right">
          <div class="brand-icon" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 10.5L12 3l9 7.5V21H3V10.5z"/>
              <path d="M8 13v5M12 13v5M16 13v5"/>
            </svg>
          </div>
          <div class="brand-texts">
            <span class="brand-fa">رادمود رادیاتور</span>
            <span class="brand-en">RadMod Radiator</span>
          </div>
        </a>

        <!-- بخش میانی: انتخاب زبان و نمایش ساعت -->
        <div class="header-center">
          <div class="lang-pill">
            <span>🇮🇷</span>
            <select aria-label="انتخاب زبان">
              <option value="fa">فارسی</option>
              <option value="ar">العربية</option>
              <option value="en">English</option>
            </select>
          </div>

          <div class="clock-box">
            <span>🕒</span>
            <div>
              <span id="liveDate">۱۴۰۵/۰۹/۰۳</span>
              <span id="liveClock" class="clock-time">07:49:00</span>
            </div>
          </div>
        </div>

        <!-- ابزارهای سمت چپ هدر -->
        <div class="header-tools">
          <div class="theme-switch" title="تغییر تم">
            <button type="button" class="theme-btn" aria-label="روز">☀️</button>
            <button type="button" class="theme-btn active" aria-label="شب">🌙</button>
          </div>

          <button type="button" class="icon-btn" aria-label="جستجو">🔍</button>

          <button type="button" class="icon-btn" aria-label="سبد استعلام">
            🛒
            <span class="cart-badge">۰</span>
          </button>

          <button type="button" class="icon-btn" aria-label="حساب کاربری">👤</button>
        </div>
      </div>

      <!-- منوی ناوبری -->
      <div class="header-nav-wrap">
        <nav class="nav-bar" aria-label="منوی اصلی">
          <a href="#home" class="nav-link active">🏠 خانه</a>
          <a href="#products" class="nav-link">⊞ محصولات</a>
          <a href="#gallery" class="nav-link">🖼️ گالری تصاویر</a>
          <a href="#about" class="nav-link">👥 درباره ما</a>
          <a href="#contact" class="nav-link">📞 تماس با ما</a>
          <a href="#guide" class="nav-link">🛠️ راهنمای خرید</a>
          <a href="#blog" class="nav-link">📰 وبلاگ</a>
        </nav>
      </div>
    </div>
  </header>

  <main id="home" class="stage-preview">
    <div class="stage-card">
      <h2>قدم اول: هدر آماده شد</h2>
      <p>هدر با عنوان «رادمود رادیاتور» در سمت راست و بدون طراحی گرافیکی سنگین چیده شد. قدم بعدی که می‌خواهی طراحی کنیم چیست؟</p>
    </div>
  </main>

  <script>
    function updateClock() {
      const now = new Date();
      const timeStr = now.toLocaleTimeString('fa-IR', { hour12: false });
      document.getElementById('liveClock').textContent = timeStr;
    }
    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
